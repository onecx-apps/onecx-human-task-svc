openapi: 3.0.3
info:
  title: onecx-human-task external service V1
  description: External API used by workflow providers (eg. Camunda, n8n) to create human tasks in OneCX.
  version: 1.0.0

servers:
  - url: https://onecx-human-task-svc:8080

tags:
  - name: tasks
    description: Managing human tasks

paths:
  /v1/tasks:
    post:
      security:
        - oauth2: [ ocx-ht:all, ocx-ht:write ]
      tags:
        - tasks
      description: Create a new human task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        204:
          description: Task created successfully
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://oauth.simple.api/token
          scopes:
            "ocx-ht:all": Grants access to all operations
            "ocx-ht:read": Grants read access
            "ocx-ht:write": Grants write access
            "ocx-ht:delete": Grants access to delete operations

  schemas:
    CreateTaskRequest:
      type: object
      required:
        - title
        - providerType
        - providerTaskId
        - providerURL
      properties:
        title:
          type: string
          maxLength: 255
          description: The title of the task.
        description:
          type: string
          maxLength: 255
          description: The description of the task.
        providerType:
          $ref: '#/components/schemas/ProviderType'
        providerTaskId:
          type: string
          maxLength: 255
          description: The task ID in the external provider system.
        providerURL:
          type: string
          maxLength: 255
          description: URL used to later accept or decline the task via the provider adapter.
        customInput:
          type: array
          items:
            type: string
          description: Optional arbitrary keys provided by the provider during task creation.

    ProviderType:
      type: string
      enum:
        - CAMUNDA
        - N8N

    ProblemDetailResponse:
      type: object
      properties:
        errorCode:
          type: string
        detail:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailParam'
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailInvalidParam'

    ProblemDetailParam:
      type: object
      properties:
        key:
          type: string
        value:
          type: string

    ProblemDetailInvalidParam:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
