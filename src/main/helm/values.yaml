app:
  name: svc
  image:
    repository: "onecx/onecx-human-task-svc"
  db:
    enabled: true
  operator:
    keycloak:
      client:
        enabled: true
        spec:
          kcConfig:
            defaultClientScopes: [ ocx-ht:read, ocx-ht:write, ocx-tn:read ]
    microservice:
      spec:
        description: OneCX Human Task Backend Service
        name: OneCX Human Task SVC
